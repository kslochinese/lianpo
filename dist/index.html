<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b2a22" />
    <meta name="description" content="《廉頗藺相如列傳》十八頁漫畫閱讀網站。" />
    <title>廉頗藺相如列傳｜漫畫閱讀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">跳到漫畫閱讀器</a>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="回到首頁">
        <span class="brand-seal">玉</span>
        <span><small>史記・漫畫閱讀</small><strong>廉頗藺相如列傳</strong></span>
      </a>
      <nav class="top-nav" aria-label="主選單"><a href="#reader">漫畫閱讀</a></nav>
      <img class="site-logo" src="./assets/kslochinese.jpeg" alt="羅桂祥中文科" />
    </header>

    <main>
      <section id="home" class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span>十八頁漫畫</span>依序閱讀</p>
          <h1 id="hero-title">《廉頗藺相如列傳》</h1>
          <p class="hero-subtitle">漫畫閱讀</p>
          <p class="hero-summary">請使用頁碼、前後按鈕或鍵盤左右方向鍵翻閱漫畫。</p>
          <a class="button button-primary" href="#reader">開始閱讀 <span aria-hidden="true">↓</span></a>
          <p class="hero-note">共 18 頁</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="jade-disc"></div>
          <div class="mountain mountain-back"></div>
          <div class="mountain mountain-front"></div>
          <p class="vertical-label">漫畫閱讀</p>
        </div>
      </section>

      <section id="reader" class="reader" aria-labelledby="reader-title">
        <div class="reader-title-row">
          <div>
            <p class="eyebrow"><span>漫畫閱讀器</span>選擇章節或頁碼</p>
            <h2 id="reader-title">依序翻閱十八頁漫畫</h2>
          </div>
          <div class="reader-progress-wrap">
            <span id="progress-label">第 1 / 18 頁</span>
            <progress id="reading-progress" value="1" max="18">1 / 18</progress>
          </div>
        </div>

        <div class="reader-shell">
          <aside class="chapter-sidebar" aria-label="章節導覽">
            <p class="sidebar-label">章節導航</p>
            <div id="chapter-list" class="chapter-list"></div>
          </aside>

          <div class="comic-stage">
            <div class="stage-topline">
              <p id="page-chapter">第一章・完璧歸趙</p>
              <p id="page-title">第 1 頁・秦書求璧</p>
            </div>
            <figure class="comic-frame">
              <button id="image-zoom" class="image-zoom" type="button" aria-label="放大檢視本頁漫畫">
                <img id="comic-image" src="" alt="《廉頗藺相如列傳》漫畫第 1 頁" />
                <span class="zoom-hint">放大檢視 ↗</span>
              </button>
            </figure>
            <div class="reader-controls">
              <button id="prev-page" class="reader-button" type="button"><span aria-hidden="true">←</span> 上一頁</button>
              <button id="full-view" class="reader-button reader-button-light" type="button">全頁檢視</button>
              <button id="next-page" class="reader-button" type="button">下一頁 <span aria-hidden="true">→</span></button>
            </div>
            <div id="page-dots" class="page-dots" aria-label="頁碼導覽"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><strong>《廉頗藺相如列傳》漫畫閱讀</strong>　依使用者提供漫畫圖檔編排。</p>
      <p>使用左右方向鍵或頁碼可切換頁面。</p>
    </footer>

    <dialog id="comic-dialog" class="comic-dialog" aria-label="全頁漫畫檢視">
      <div class="dialog-toolbar">
        <p id="dialog-title">全頁漫畫檢視</p>
        <button id="dialog-close" type="button">關閉 ×</button>
      </div>
      <img id="dialog-image" src="" alt="" />
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
